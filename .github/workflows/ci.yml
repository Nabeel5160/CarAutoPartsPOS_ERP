name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Restore
        run: dotnet restore CarAutoParts.sln
      - name: Build
        run: dotnet build CarAutoParts.sln -c Release --no-restore
      - name: Domain tests
        run: dotnet test tests/CarAutoParts.Domain.Tests/CarAutoParts.Domain.Tests.csproj -c Release --no-build --verbosity minimal
      - name: Application tests
        run: dotnet test tests/CarAutoParts.Application.Tests/CarAutoParts.Application.Tests.csproj -c Release --no-build --verbosity minimal
